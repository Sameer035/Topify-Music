<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topify - Music Player</title>

  <!-- Font Awesome Icons & External CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="Topify.png" alt="Topify" />
        <h1 class="light_green">Topify</h1>
      </div>
      <nav class="nav-menu">
        <a href="#" class="active"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="#" id="search-link"><i class="fas fa-search"></i> <span>Search</span></a>
        <a href="#"><i class="fas fa-book"></i> <span>Library</span></a>
      </nav>
      <div class="playlist-section">
        <h2>Playlists</h2>
        <div class="playlist">
          <a href="#" class="active">Arijit Singh Hits</a>
          <a href="#">Vishal Mishra Collection</a>
          <a href="#">Mixed Hits</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <div class="user-nav">
          <button class="nav-btn"><i class="fas fa-chevron-left"></i></button>
          <button class="nav-btn"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="search-container" style="display:none">
          <input type="text" id="search-input" placeholder="Search songs…" />
        </div>

        <div class="user-menu">
          <button class="profile-btn" id="profile-btn">
            <i class="fas fa-user"></i><span>User</span>
          </button>
          <div class="profile-dropdown" id="profile-dropdown">
            <a href="#"><i class="fas fa-user"></i> Profile</a>
            <a href="#"><i class="fas fa-cog"></i> Settings</a>
            <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
          </div>
        </div>
      </header>

      <div class="content">
        <h1 id="page-title">Popular Songs</h1>
        <div class="songs-grid" id="songs-container"></div>
      </div>
    </main>
  </div>

  <!-- Bottom Music Player -->
  <div class="music-player">
    <div class="song-info">
      <img id="current-song-image" src="https://via.placeholder.com/56" alt="Album Art" />
      <div class="song-details">
        <h4 id="current-song-name">Select a song</h4>
        <p id="current-song-artist">-</p>
      </div>
      <button class="like-btn"><i class="far fa-heart"></i></button>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="shuffle-btn"><i class="fas fa-random"></i></button>
        <button class="prev-btn"><i class="fas fa-step-backward"></i></button>
        <button class="play-btn" id="play-btn"><i class="fas fa-play"></i></button>
        <button class="next-btn"><i class="fas fa-step-forward"></i></button>
        <button class="repeat-btn"><i class="fas fa-redo"></i></button>
      </div>
      <div class="progress-area">
        <span id="current-time">0:00</span>
        <div class="progress-bar"><div class="progress"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-options">
      <button class="volume-btn" id="volume-btn"><i class="fas fa-volume-up"></i></button>
      <div class="volume-slider" id="volume-slider"><div class="volume-progress" id="volume-progress"></div></div>
    </div>
  </div>

  <audio id="audio-player"></audio>
  <script src="script.js"></script>
</body>
</html>
